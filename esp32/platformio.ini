[env:xiao_esp32s3]
platform = espressif32
board = seeed_xiao_esp32s3
framework = arduino
; 编译选项
build_flags = 
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1
    -mfix-esp32-psram-cache-issue
; 上传配置
upload_speed = 921600
monitor_speed = 115200
; 库依赖
lib_deps = 
    bblanchon/ArduinoJson@^6.21.3
    espressif/esp32-camera@^2.0.0
