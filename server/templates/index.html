<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Glasses Assistant</title>
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="header-top">
                <h1>Smart Glasses Assistant</h1>
                <button class="theme-toggle" id="themeToggle" onclick="toggleTheme()">
                    <span class="icon">&#x1F319;</span>
                    <span class="label">Dark</span>
                </button>
            </div>
            
            <div class="status-bar">
                <span class="status-dot" id="statusDot"></span>
                <span class="status-text">Real-time monitoring - Press BOOT to capture</span>
            </div>
            
            <div class="config-section">
                <h3>&#x2699; API Config</h3>
                <div class="config-row">
                    <div class="form-group">
                        <label>API Key</label>
                        <input type="password" id="apiKeyInput" placeholder="Enter SiliconFlow API Key">
                    </div>
                    <div class="form-group">
                        <label>AI Model</label>
                        <select id="modelSelect">
                            <option value="Qwen/Qwen3-VL-8B-Instruct">Qwen3-VL-8B-Instruct (Recommended)</option>
                        </select>
                    </div>
                </div>
                <div class="config-actions">
                    <button class="btn btn-primary" onclick="saveConfig()">&#x1F4BE; Save Config</button>
                    <button class="btn btn-secondary" onclick="resetConfig()">&#x1F504; Reset</button>
                </div>
                <div id="configStatus" class="status-message"></div>
            </div>
            
            <div class="prompt-section">
                <h3>&#x1F3AF; Prompt Settings</h3>
                <div class="preset-buttons">
                    <button class="preset-btn" onclick="loadPreset('ocr')">OCR Recognition</button>
                    <button class="preset-btn" onclick="loadPreset('scene')">Scene Recognition</button>
                    <button class="preset-btn" onclick="loadPreset('describe')">Detailed Description</button>
                    <button class="preset-btn" onclick="loadPreset('qa')">Q&amp;A Mode</button>
                </div>
                <textarea id="promptInput" class="prompt-textarea" placeholder="Enter custom prompt..."></textarea>
                <div class="config-actions">
                    <button class="btn btn-primary" onclick="savePrompt()">&#x1F4BE; Save Prompt</button>
                    <button class="btn btn-secondary" onclick="resetPrompt()">&#x1F504; Reset</button>
                </div>
                <div id="promptStatus" class="status-message"></div>
            </div>
        </div>
        
        <div id="photosContainer">
            <div class="loading-spinner">
                <div class="spinner"></div>
                <span>Loading photos...</span>
            </div>
        </div>
        
        <div class="footer">
            <p>Smart Glasses Assistant v2.0 | Powered by SiliconFlow</p>
        </div>
    </div>
    
    <div class="lightbox-overlay" id="lightbox" onclick="closeLightbox(event)">
        <button class="lightbox-close" onclick="closeLightbox(event)">&times;</button>
        <img src="" alt="Photo" class="lightbox-content" id="lightboxImg">
    </div>
    
    <script src="/static/js/main.js"></script>
</body>
</html>
